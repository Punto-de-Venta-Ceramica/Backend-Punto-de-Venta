spring.application.name=puntoventaapi

# Carga las variables del archivo .env de la raíz del proyecto, si existe.
spring.config.import=optional:file:.env[.properties]

# Render: use the external hostname when running on your computer.
# DB_URL optionally overrides the entire JDBC URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:barrocontrolbd}?sslmode=${DB_SSLMODE:require}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# The database is barrocontrolbd; barrocontrol is its internal PostgreSQL schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.default_schema=barrocontrol
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false

# PostgreSQL views, expression index and composite FK complement Hibernate's DDL.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/postgresql-complementos.sql
spring.sql.init.separator=^^^
spring.sql.init.continue-on-error=false
server.port=${PORT:8080}

# JWT (HS256). JWT_SECRETO debe tener al menos 32 caracteres y nunca subirse a Git.
jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}
